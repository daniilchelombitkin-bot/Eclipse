<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EclipseBet — Contact Us</title>
  <style>
    @font-face {
      font-family: "Mont";
      src: url("fonts/Mont-Bold.woff2") format("woff2");
      font-weight: 700;
      font-display: swap;
    }

    body {
      margin: 0;
      height: 100vh;
      display: grid;
      place-items: center;
      background: #000;
      overflow: hidden;
    }

    /* Размытая заливка полей по краям тем же фоном (видна в основном в F11) */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      background: url("background.webp") center / cover no-repeat;
      filter: blur(24px);
      transform: scale(1.1);
    }

    .stage {
      position: relative;
      width: 1920px;
      height: 945px;
      flex: none;
      background: url("background.webp") center / cover no-repeat;
      transform: scale(1);
      transform-origin: center;
    }

    .stage a,
    .stage button {
      position: absolute;
      cursor: pointer;
    }

    .phone {
      left: 95px;
      top: 477px;
      border: 0;
      padding: 0;
      background: linear-gradient(180deg, #fff, #999);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      font: 700 96px/1 "Mont", Arial, sans-serif;
      filter: drop-shadow(0 2px 2px rgba(0, 0, 0, 0.35));
    }

    .back {
      left: 95px;
      top: 717px;
    }

    .toast {
      position: absolute;
      left: 95px;
      top: 600px;
      padding: 11px 20px;
      border-radius: 999px;
      border: 1px solid rgba(232, 200, 121, 0.55);
      background: rgba(18, 16, 12, 0.85);
      color: #e8c879;
      font: 600 22px/1 Arial, sans-serif;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .toast.show {
      opacity: 1;
    }
  </style>
</head>
<body>
  <main class="stage">
    <button class="phone" id="phone">+90 212 9224859</button>
    <div class="toast" id="toast">✓ Number copied</div>
    <a class="back" href="https://eclipsebet.online"><img src="backtosite.png" alt="Back to site"></a>
  </main>

  <script>
    // Вписываем макет 1920×945 в текущее окно браузера, сохраняя пропорции
    const stage = document.querySelector(".stage");
    function fitStage() {
      const scale = Math.min(window.innerWidth / 1920, window.innerHeight / 945);
      stage.style.transform = "scale(" + scale + ")";
    }
    fitStage();
    window.addEventListener("resize", fitStage);

    const phone = document.getElementById("phone");
    const toast = document.getElementById("toast");
    let timer;

    phone.addEventListener("click", async () => {
      await navigator.clipboard.writeText(phone.textContent.trim());
      toast.classList.add("show");
      clearTimeout(timer);
      timer = setTimeout(() => toast.classList.remove("show"), 1400);
    });
  </script>
</body>
</html>
