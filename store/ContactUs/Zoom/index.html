<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EclipseBet — Contact Us</title>
  <style>
    @font-face {
      font-family: "Mont";
      src: url("fonts/Mont-Bold.woff2") format("woff2");
      font-weight: 700;
      font-display: swap;
    }
    body {
      margin: 0;
      height: 100vh;
      display: grid;
      place-items: center;
      background: #000;
      overflow: hidden;
    }
    /* Размытая заливка полей по краям тем же фоном (видна в основном в F11) */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      background: url("background.webp") center / cover no-repeat;
      filter: blur(24px);
      transform: scale(1.1);
    }
    .stage {
      position: relative;
      width: 1920px;
      height: 945px;
      flex: none;
      background: url("background.webp") center / cover no-repeat;
      transform: scale(1);
      transform-origin: center;
    }
    .stage a,
    .stage button {
      position: absolute;
      cursor: pointer;
    }
    .phone {
      left: 95px;
      top: 477px;
      border: 0;
      padding: 0;
      background: linear-gradient(180deg, #fff, #999);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      font: 700 96px/1 "Mont", Arial, sans-serif;
      filter: drop-shadow(0 2px 2px rgba(0, 0, 0, 0.35));
    }
    .back {
      left: 95px;
      top: 717px;
    }
    .toast {
      position: absolute;
      left: 95px;
      top: 600px;
      padding: 11px 20px;
      border-radius: 999px;
      border: 1px solid rgba(232, 200, 121, 0.55);
      background: rgba(18, 16, 12, 0.85);
      color: #e8c879;
      font: 600 22px/1 Arial, sans-serif;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .toast.show {
      opacity: 1;
    }
  </style>
</head>
<body>
  <main class="stage">
    <!-- Номер в HTML — fallback, если API вернёт null или будет недоступен -->
    <button class="phone" id="phone">+90 212 9224859</button>
    <div class="toast" id="toast">✓ Number copied</div>
    <a class="back" href="https://eclipsebet.online"><img src="backtosite.png" alt="Back to site"></a>
  </main>
  <script>
    // ============================================
    // ЗАГРУЗКА НОМЕРА С API (только TR)
    // API в приоритете; если вернул null / пусто /
    // недоступен — остаётся номер, зашитый в HTML.
    // ============================================
    const API_URL = "https://backend.w-h.app/widgets/api/eclipse?language=tr";

    const phone = document.getElementById("phone");
    const toast = document.getElementById("toast");

    // Приводим номер к виду +90 212 9224859
    function formatPhone(val) {
      // выкидываем всё кроме цифр
      const digits = val.replace(/\D/g, "");
      // турецкий номер: 90 + 3 цифры кода + 7 цифр
      if (digits.startsWith("90") && digits.length === 12) {
        return "+90 " + digits.slice(2, 5) + " " + digits.slice(5);
      }
      // неожиданный формат — просто плюс и цифры, без пробелов
      return "+" + digits;
    }

    // Достаём номер из ответа независимо от формата:
    // голая строка, JSON-строка или объект { "phone": "..." }
    function extractPhone(raw) {
      const text = raw.trim();
      if (!text || text === "null") return null;
      let val = null;
      try {
        const data = JSON.parse(text);
        if (data === null) return null;
        if (typeof data === "string") val = data;
        else if (typeof data === "object") val = data.phone ?? data.number ?? data.value;
      } catch {
        // не JSON — значит, просто текст с номером
        val = text;
      }
      if (typeof val !== "string" || !val.trim()) return null;
      return formatPhone(val.trim());
    }

    async function loadPhone() {
      try {
        const res = await fetch(API_URL, { cache: "no-store" });
        if (!res.ok) return;
        const number = extractPhone(await res.text());
        if (number) phone.textContent = number;
        // number === null → остаётся номер из HTML
      } catch (e) {
        console.warn("Ошибка запроса к API:", e);
      }
    }

    loadPhone();

    // ============================================
    // Вписываем макет 1920×945 в текущее окно браузера, сохраняя пропорции
    // ============================================
    const stage = document.querySelector(".stage");
    function fitStage() {
      const scale = Math.min(window.innerWidth / 1920, window.innerHeight / 945);
      stage.style.transform = "scale(" + scale + ")";
    }
    fitStage();
    window.addEventListener("resize", fitStage);

    // ============================================
    // Копирование номера по клику
    // ============================================
    let timer;
    phone.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(phone.textContent.trim());
        toast.classList.add("show");
        clearTimeout(timer);
        timer = setTimeout(() => toast.classList.remove("show"), 1400);
      } catch (e) {
        console.warn("Clipboard error:", e);
      }
    });
  </script>
</body>
</html>
