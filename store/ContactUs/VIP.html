<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MoyoBetKE - Contact Us</title>
  <style>
    @font-face {
      font-family: 'Freich';
      src: url('assets/Freich.otf') format('opentype');
      font-display: swap;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
    }

    .scene {
      position: absolute;
      top: 0;
      left: 0;
      width: 1920px;
      height: 1080px;
      transform-origin: top left;
    }

    .bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 1920px;
      height: 1080px;
    }

    .logo-img {
      position: absolute;
      left: 432px;
      top: 52px;
      width: 452.24px;
      height: 71px;
      z-index: 2;
    }

    .backtosite-link {
      position: absolute;
      left: 345px;
      top: 888px;
      width: 423px;
      height: 96px;
      z-index: 2;
      text-decoration: none;
    }

    .backtosite-link img {
      width: 100%;
      height: 100%;
      transition: transform 0.2s ease, filter 0.2s ease;
    }

    .backtosite-link:hover img {
      transform: scale(1.06);
      filter: brightness(1.15) drop-shadow(0 0 12px #a855f7);
    }

    .call-link {
      position: absolute;
      /* right edge of the number aligns with the VOICE CALLS label (ends at x911) */
      left: 171px;
      top: 398px;
      z-index: 2;
      text-decoration: none;
    }

    .whatsapp-link {
      position: absolute;
      /* right edge of the number aligns with the WHATSAPP label (ends at x916) */
      left: 186px;
      top: 567px;
      z-index: 2;
      text-decoration: none;
    }

    .phone-number {
      display: block;
      font-family: 'Freich', sans-serif;
      font-weight: normal;
      font-size: 100px;
      line-height: 1;
      white-space: nowrap;
      background:
        linear-gradient(180deg,
          transparent 0 calc(0.875em - 3px),
          #528F3C calc(0.875em - 3px) 0.875em,
          transparent 0.875em),
        linear-gradient(90deg, #8CD53C, #FFE933);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(-4px 6px 6.3px rgba(0, 0, 0, 0.54));
      transition: transform 0.2s ease;
    }

    .call-link:hover .phone-number,
    .whatsapp-link:hover .phone-number {
      transform: scale(1.04);
    }

    .copied-tip {
      position: absolute;
      left: 50%;
      top: -40px;
      transform: translateX(-50%);
      font-family: 'Freich', sans-serif;
      font-size: 30px;
      color: #FFE933;
      background: rgba(0, 0, 0, 0.65);
      padding: 8px 18px;
      border-radius: 12px;
      white-space: nowrap;
      pointer-events: none;
      animation: tipfade 1.2s ease forwards;
    }

    @keyframes tipfade {
      0% { opacity: 0; }
      15% { opacity: 1; }
      70% { opacity: 1; }
      100% { opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="scene" id="scene">

    <img class="bg" src="assetsVIP/backgroundVIP.webp" alt="">

    <img class="logo-img" src="assetsVIP/logo.png" alt="MoyoBetKE">

    <a class="backtosite-link" href="https://www.moyobet.ke">
      <img src="assetsVIP/backtosite.png" alt="Back to site">
    </a>

    <a class="call-link" href="tel:+254700443344">
      <span class="phone-number">+254 700 443 344</span>
    </a>

    <a class="whatsapp-link" href="https://wa.me/254796948054" target="_blank">
      <span class="phone-number">+254 796 948 054</span>
    </a>

  </div>

  <script>
    function scaleScene() {
      const scene = document.getElementById('scene');
      const scaleX = window.innerWidth / 1920;
      const scaleY = window.innerHeight / 1080;
      scene.style.transform = `scale(${scaleX}, ${scaleY})`;
    }

    scaleScene();
    window.addEventListener('resize', scaleScene);

    function fallbackCopy(text) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
    }

    function showCopied(link) {
      const old = link.querySelector('.copied-tip');
      if (old) old.remove();
      const tip = document.createElement('span');
      tip.className = 'copied-tip';
      tip.textContent = 'COPIED!';
      link.appendChild(tip);
      setTimeout(() => tip.remove(), 1200);
    }

    document.querySelectorAll('.phone-link, .call-link, .whatsapp-link').forEach(link => {
      link.addEventListener('click', e => {
        e.preventDefault();
        const text = link.querySelector('.phone-number').textContent.trim();
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).catch(() => fallbackCopy(text));
        } else {
          fallbackCopy(text);
        }
        showCopied(link);
      });
    });
  </script>
</body>
</html>
