<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Cat Banner</title>
    <link rel="stylesheet" href="style_mobile.css">
</head>
<body>

<div class="banner-wrapper">
    <div class="banner-container">
        <!-- Фон -->
        <img
            src="https://cmsbetconstruct.com/storage/medias/betsunrise/media_1868048_6f62a359eae8ffedc726d396da5ed107.png"
            alt="Crypto Bank Background"
            class="banner-bg"
        >

        <!-- Монетный дождь - ЗА всеми элементами -->
        <div class="coins-rain"></div>

        <!-- Все элементы поверх фона -->
        <div class="overlay">

            <!-- Кот -->
            <img
                src="https://cmsbetconstruct.com/storage/medias/betsunrise/media_1868048_b6d051e27b4013e6517d7153befc36c7.png"
                alt="Cat"
                class="cat"
            >

            <!-- Текст бонуса -->
            <img
                src="https://cmsbetconstruct.com/storage/medias/betsunrise/media_1868048_57a18f611d6747ecbaaecfd8a9df90ab.png"
                alt="15% Bonus Text"
                class="banner-text"
            >

            <!-- Монеты справа -->
            <img
                src="https://cmsbetconstruct.com/storage/medias/betsunrise/media_1868048_855c8908b98a12d1c8d817006a1214ae.png"
                alt="Crypto Coins"
                class="coins-group"
            >

            <!-- Плашки снизу -->
            <div class="crypto-badges">
                <img
                    src="https://cmsbetconstruct.com/storage/medias/betsunrise/media_1868048_7b5bbf48e50fffb3a99437bb2125d920.png"
                    alt="Crypto Badges"
                    class="crypto-silhouette"
                >
            </div>

        </div>
    </div>
</div>

<script src="script_mobile.js"></script>
</body>
</html>
